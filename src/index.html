<!doctype html>
<html lang="en">
  <head>
    <!-- HTML Meta Tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="title" content="Production Ratio Calculator" />
    <meta
      name="description"
      content="Interactive machine ratio calculator for factory automation games like Factorio, etc..."
    />
    <meta
      name="keywords"
      content="Factorio, Calculator, Ratios, Production, DDDGamer, Denis Zholob"
    />
    <meta name="author" content="Denis Zholob" />

    <!-- Google / Search Engine Tags -->
    <meta itemprop="name" content="Production Ratio Calculator" />
    <meta
      itemprop="description"
      content="Interactive machine ratio calculator for factory automation games like Factorio, etc..."
    />
    <meta itemprop="image" content="https://wiki.factorio.com/images/Assembling_machine_1.png" />

    <!-- Facebook Meta Tags -->
    <meta property="og:url" content="https://deniszholob.github.io/factorio-blueprints/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Production Ratio Calculator" />
    <meta
      property="og:description"
      content="Interactive machine ratio calculator for factory automation games like Factorio, etc..."
    />
    <meta property="og:image" content="https://wiki.factorio.com/images/Assembling_machine_1.png" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Production Ratio Calculator" />
    <meta
      name="twitter:description"
      content="Interactive machine ratio calculator for factory automation games like Factorio, etc..."
    />
    <meta
      name="twitter:image"
      content="https://wiki.factorio.com/images/Assembling_machine_1.png"
    />

    <!-- Title/Icons -->
    <title>Production Ratio Calculator</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="https://wiki.factorio.com/images/Assembling_machine_1.png"
    />
    <meta name="msapplication-TileColor" content="#189ADF" />
    <base href="/" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#189ADF" />

    <!-- Meta Tags Generated via http://heymeta.com -->

    <!-- Prefetch/Preconnect -->
    <link rel="dns-prefetch" href="//use.fontawesome.com" />
    <link rel="preconnect" href="//use.fontawesome.com" crossorigin="anonymous" />

    <!-- Fonts -->
    <script
      defer
      src="https://use.fontawesome.com/releases/v6.4.0/js/all.js"
      integrity="sha384-Y7LSKwoY+C2iyfu/oupNnkGEN3EgA6skmJeVg5AyQk7ttcjX0XsLREmmuJW/SdbU"
      crossorigin="anonymous"
    ></script>

    <!-- Stylesheets -->
    <style>
      .app-loading-spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        margin-right: 6px;
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-top-color: rgba(255, 255, 255, 0.9);
        border-radius: 9999px;
        animation: app-spin 0.9s linear infinite;
        vertical-align: text-bottom;
      }
      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-28080172-12"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'UA-28080172-12');
    </script>
  </head>

  <body>
    <app-root>
      <div style="text-align: center; padding-top: 20px">
        <span class="app-loading-spinner" aria-hidden="true"></span>
        Loading...

        <p>
          If this is loading forever, there may be a bug.
          <br />
          Hit <strong>F12</strong> to bring up the Debug Console, and
          <a
            href="https://github.com/deniszholob/factorio-machine-ratio-calc/issues"
            target="_blank"
            rel="noopener"
          >
            report
          </a>
          any errors.
        </p>

        <br />

        <p class="text-muted">
          <span>
            <strong>Build: </strong>
            {{BUILD_VERSION}} - {{BUILD_DATE_FORMATTED}}
          </span>
        </p>
      </div>
    </app-root>
  </body>
</html>
