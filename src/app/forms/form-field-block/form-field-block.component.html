<div class="flex flex-col gap-1" [ngClass]="$className()">
  <span
    class="text-xs font-semibold tracking-wide whitespace-nowrap text-stone-400 uppercase"
    [ngClass]="{
      'pl-9': $hasPrefixAddon(),
    }"
  >
    {{ $label() }}
  </span>
  <div
    class="flex min-w-0 items-stretch"
    [ngClass]="{
      'rounded-sm ring-1 ring-stone-600/70 transition-colors focus-within:ring-blue-400/80':
        $hasAddon(),
    }"
  >
    @if ($hasPrefixAddon()) {
      <span
        class="inline-flex h-9 w-9 shrink-0 items-center justify-center gap-1 border-r border-stone-600/70 bg-stone-800 text-xs font-semibold text-stone-300"
        [ngClass]="{
          'rounded-l-sm': $hasAddon(),
          'px-2': !$hasImagePrefixOnly(),
        }"
      >
        @if ($prefixImageUrl()) {
          <img
            class="h-8 w-8 object-cover"
            [ngClass]="{
              'p-0.5': $hasImagePrefixOnly(),
            }"
            [src]="$prefixImageUrl()"
            [alt]="$label() + ' icon'"
          />
        }
        @if ($prefixIconClass()) {
          <i [class]="$prefixIconClass()"></i>
        }
        @if ($prefix()) {
          <span>{{ $prefix() }}</span>
        }
      </span>
    }
    <div
      class="w-full min-w-0 flex-1 [&_input]:h-9 [&_input]:w-full [&_input]:max-w-none [&_input]:bg-neutral-700 [&_input]:px-3 [&_input]:py-2 [&_input]:text-sm [&_input]:text-slate-200 [&_input]:placeholder-stone-500 [&_input]:shadow-none [&_input]:ring-0 [&_input]:outline-none [&_input]:focus:ring-0 [&_input]:focus:outline-hidden"
      [ngClass]="{
        '[&_input]:rounded-none [&_input]:border-0': $hasPrefixAddon() && $hasSuffixAddon(),
        '[&_input]:rounded-l-none [&_input]:rounded-r-sm [&_input]:border-0':
          $hasPrefixAddon() && !$hasSuffixAddon(),
        '[&_input]:rounded-l-sm [&_input]:rounded-r-none [&_input]:border-0':
          !$hasPrefixAddon() && $hasSuffixAddon(),
      }"
    >
      <ng-content></ng-content>
    </div>
    @if ($hasSuffixAddon()) {
      <span
        class="inline-flex h-9 shrink-0 items-center gap-1 border-l border-stone-600/70 bg-stone-800 px-2 text-xs font-semibold text-stone-300"
        [ngClass]="{
          'rounded-r-sm': $hasAddon(),
        }"
      >
        @if ($suffixIconClass()) {
          <i [class]="$suffixIconClass()"></i>
        }
        @if ($suffix()) {
          <span>{{ $suffix() }}</span>
        }
      </span>
    }
  </div>
</div>
