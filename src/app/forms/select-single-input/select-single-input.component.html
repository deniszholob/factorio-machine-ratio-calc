<app-form-field-block
  [$label]="$label()"
  [$className]="$className()"
  [$prefix]="$prefix()"
  [$suffix]="$suffix()"
  [$suffixIconClass]="$suffixIconClass()"
  [$prefixIconClass]="$prefixIconClass()"
  [$prefixImageUrl]="$prefixImageUrl()"
>
  <ng-select
    class="app-ng-select app-field-control h-9 min-w-44"
    [items]="$options()"
    [ngModel]="$value()"
    [placeholder]="$effectivePlaceholder()"
    [notFoundText]="$notFoundText()"
    [addTagText]="$addTagText()"
    [clearable]="$clearable()"
    [searchable]="true"
    [addTag]="$addTag()"
    [attr.aria-label]="$name() || $label() || $placeholder() || 'Select value'"
    (ngModelChange)="onChange($event)"
    (blur)="onBlur()"
  >
    <ng-template ng-option-tmp let-item="item">
      <span class="text-stone-200">{{ item }}</span>
    </ng-template>

    <ng-template ng-label-tmp let-item="item">
      <span class="text-stone-200">{{ item }}</span>
    </ng-template>
  </ng-select>
</app-form-field-block>
