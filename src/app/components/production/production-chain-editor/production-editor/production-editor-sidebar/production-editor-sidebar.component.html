@let machine = $machine();

@if ($show()) {
  <aside
    class="flex h-full min-h-0 w-full flex-col gap-4 overflow-hidden bg-stone-900 p-4 text-slate-50"
    aria-label="Production editor sidebar"
  >
    <div class="flex items-center justify-between gap-2">
      <div class="text-xs font-semibold tracking-[0.32em] text-stone-400 uppercase">
        Production Editor
      </div>

      <button
        class="btn btn-icon btn-danger-outline"
        [title]="'Close editor'"
        (click)="onClose()"
        type="button"
      >
        <span class="sr-only">Close editor</span>
        <i class="fas fa-xmark"></i>
      </button>
    </div>

    <div class="min-h-0 flex-1 overflow-auto pr-1">
      <app-production-editor
        [$machine]="machine"
        ($machineChange)="$machineChange.emit($event)"
      ></app-production-editor>
    </div>
  </aside>
}
