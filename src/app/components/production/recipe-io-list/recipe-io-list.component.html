<div
  class="flex min-h-40 min-w-[22rem] flex-1 flex-col gap-2 rounded-md border transition-colors"
  [ngClass]="{
    'border-transparent': !$isDropActive(),
    'border-blue-400/70 bg-blue-950/15':
      $isDropActive() && $dropHighlightMode() === RecipeIoDropHighlightMode.WithinContainer,
    'border-orange-400/80 bg-orange-950/20':
      $isDropActive() && $dropHighlightMode() === RecipeIoDropHighlightMode.CrossContainer,
  }"
  [id]="$listId()"
  [cdkDropListData]="$items()"
  [cdkDropListConnectedTo]="$connectedTo()"
  [cdkDropListDisabled]="!$dragEnabled()"
  (cdkDropListEntered)="onDropListEntered($event)"
  (cdkDropListExited)="onDropListExited($event)"
  (cdkDropListDropped)="onDrop($event)"
  cdkDropList
>
  <div class="text-md flex flex-row items-center gap-2">
    <button class="btn btn-icon btn-success" [title]="'Add item'" (click)="onAdd()">
      <i class="fas fa-plus"></i>
    </button>
    <h5>{{ $label() }}</h5>
  </div>

  @for (item of $items(); track item; let i = $index) {
    @let itemIconUrl = $itemIconsByName()[item.name];
    <div
      class="transition-color flex w-full cursor-pointer items-center gap-2 rounded-lg border border-stone-800/70 bg-stone-950/45 p-2 text-stone-100 hover:border-stone-700 hover:bg-stone-900/70"
      [cdkDragDisabled]="!$dragEnabled()"
      [cdkDragData]="{ sourceListId: $listId() }"
      (cdkDragStarted)="onDragStarted($event)"
      (cdkDragEnded)="onDragEnded($event)"
      cdkDrag
    >
      <div class="flex flex-row flex-wrap items-end gap-2">
        @if ($dragEnabled()) {
          <button
            class="flex h-9 w-9 items-center justify-center rounded-md text-stone-300 transition-colors hover:bg-stone-800/80 hover:text-stone-100 focus-visible:ring-2 focus-visible:ring-blue-400/80 focus-visible:outline-none"
            [title]="'Drag item'"
            aria-label="Drag item"
            type="button"
            cdkDragHandle
          >
            <i class="fas fa-grip-vertical"></i>
          </button>
        }

        <button class="btn btn-icon btn-danger" [title]="'Delete item'" (click)="onRemove(i)">
          <i class="fas fa-trash"></i>
        </button>

        <app-form-field-block
          [$label]="'Qty'"
          [$className]="'w-32'"
          [$prefixIconClass]="'fas fa-cubes'"
        >
          <input
            class="h-9 w-full"
            [(ngModel)]="item.count"
            (change)="onItemCountChange(i)"
            (keyup)="onItemCountChange(i)"
            type="number"
            name="recipeItemCount"
            min="0"
            step="0.05"
          />
        </app-form-field-block>

        <app-select-single-icon-input
          [$label]="'Item'"
          [$className]="'min-w-56'"
          [$prefixImageUrl]="itemIconUrl || ''"
          [$prefixIconClass]="itemIconUrl ? '' : 'fas fa-image'"
          [$suffix]="$showRates() ? (item.rate ?? 0 | number: '0.1-2') + ' ' + $rateUnit() : ''"
          [$value]="item.name"
          [$name]="'recipeItemName'"
          [$placeholder]="'Item name'"
          [$options]="$itemNameOptions()"
          [$iconsByName]="$itemIconsByName()"
          [$showSelectedIcon]="false"
          ($valueChange)="item.name = $event"
          ($commit)="onItemNameCommit(i)"
        ></app-select-single-icon-input>
      </div>
    </div>
  }

  @if ($items().length === 0) {
    <div
      class="flex min-h-28 items-center justify-center rounded-md border border-dashed border-stone-700/80 bg-stone-950/30 px-3 py-4 text-center text-sm text-stone-400"
    >
      Drag item here or click + to add one
    </div>
  }
</div>
