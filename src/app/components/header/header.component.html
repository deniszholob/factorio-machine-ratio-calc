@let isSettingsOpen = $isSettingsOpen();
@let isCatalogOpen = $isCatalogOpen();

<div class="flex flex-col gap-3 border-b border-stone-700 pb-3">
  <div class="flex items-center justify-between gap-3">
    <a
      class="flex items-center gap-3"
      [title]="'Interactive ratio calculator for optimizing production setups in factory automation games.'"
      href="#"
      aria-label="About the Production Ratio Calculator"
    >
      <div class="flex h-9 w-9 items-center justify-center text-stone-300">
        <!-- <i class="fas fa-industry"></i> -->
        <img
          class="drop-shadow-[0_4px_8px_rgba(0,0,0,0.65)]"
          ngSrc="https://wiki.factorio.com/images/Assembling_machine_1.png"
          width="36"
          height="36"
          alt="Machine"
        />
      </div>

      <div class="flex flex-col gap-1">
        <span class="text-xs font-semibold tracking-[0.28em] text-stone-300 uppercase">
          Production Ratio
        </span>
        <span class="text-base font-semibold">Calculator</span>
      </div>
    </a>

    <div class="flex flex-row gap-1">
      <button
        class="btn btn-secondary-outline h-8 w-8"
        [ngClass]="{ 'ring-1 ring-amber-400': isCatalogOpen }"
        [title]="'Catalog'"
        (click)="onToggleCatalog()"
        type="button"
        aria-label="Catalog"
      >
        <i class="fas fa-database"></i>
      </button>

      <button
        class="btn btn-secondary-outline h-8 w-8"
        [ngClass]="{ 'ring-1 ring-amber-400': isSettingsOpen }"
        [title]="'Settings'"
        (click)="onToggleSettings()"
        type="button"
        aria-label="Settings"
      >
        <i class="fas fa-gear"></i>
      </button>
    </div>
  </div>

  <div class="flex flex-wrap items-center gap-2">
    <!-- class="btn flex flex-1 cursor-pointer items-center justify-center gap-2 border border-amber-500hover:bg-amber-600" -->
    <button
      class="btn btn-primary-outline-fill flex-1 gap-2"
      (click)="onExportProductionChains()"
      type="button"
    >
      <i class="fas fa-download"></i>
      Download All
    </button>

    <!-- class="btn flex flex-1 cursor-pointer items-center justify-center gap-2 border border-amber-500 hover:bg-amber-600" -->
    <!-- <button
      class="btn btn-primary-outline-fill flex-1 gap-2"
      (click)="onImportProduction()"
      type="button"
    >
      <i class="fas fa-cloud-arrow-up"></i>
      Import
    </button> -->

    <app-file-picker
      #importPicker
      [$filesTypesAccepted]="'.json'"
      [$btnClass]="'btn btn-primary-outline-fill flex-1 gap-2'"
      ($fileChange)="onImportProductionChains($event)"
    >
      <i class="fas fa-cloud-arrow-up"></i> Upload All
    </app-file-picker>
  </div>
</div>
