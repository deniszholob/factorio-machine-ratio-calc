<div
  class="pointer-events-none max-w-80 rounded-md border border-stone-600 bg-stone-900/95 px-3 py-2 text-sm font-medium text-stone-100 shadow-[0_12px_32px_rgba(0,0,0,0.55)] backdrop-blur"
  role="tooltip"
>
  @if ($lines().length <= 1) {
    {{ $text() }}
  } @else {
    <ul class="list-disc space-y-1 pl-4">
      @for (line of $lines(); track line) {
        <li>{{ line }}</li>
      }
    </ul>
  }
</div>
