<!-- Overlay -->
@if ($show()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center overflow-x-hidden overflow-y-auto bg-black/50 outline-hidden focus:outline-hidden"
  >
    <!-- Centering -->
    <div class="relative mx-auto my-6 w-full max-w-6xl">
      <!--content-->
      <div
        class="relative flex w-full flex-col rounded-lg border border-stone-700 bg-stone-900 text-slate-50 shadow-lg outline-hidden focus:outline-hidden"
      >
        <!--header-->
        <div
          class="flex items-start justify-between rounded-t-lg border-b border-solid border-stone-700 bg-stone-950/50"
        >
          <h3 class="p-4 text-2xl font-semibold">
            {{ $title() }}
          </h3>

          <button
            class="btn float-right ml-auto border-0 bg-transparent p-4 text-3xl leading-none font-semibold text-red-500 hover:text-red-400"
            (click)="closeModal()"
            title="Close"
          >
            <span class="block h-6 w-6 bg-transparent outline-hidden focus:outline-hidden">
              ×
            </span>
          </button>
        </div>

        <!--body-->
        <div [class]="$bodyClass()">
          <ng-content></ng-content>
        </div>

        <!--footer-->
        @if ($primaryButton() || $secondaryButton()) {
          <div
            class="flex items-center justify-end gap-2 rounded-b border-t border-solid border-stone-800 bg-stone-950/50 p-6"
          >
            @if ($primaryButton()) {
              <button
                class="btn btn-secondary-outline"
                (click)="onSecondaryButtonClick()"
                type="button"
              >
                {{ $secondaryButton() }}
              </button>
            }

            @if ($primaryButton()) {
              <button class="btn btn-primary" (click)="onPrimaryButtonClick()" type="button">
                {{ $primaryButton() }}
              </button>
            }
          </div>
        }
      </div>
    </div>
  </div>
}
