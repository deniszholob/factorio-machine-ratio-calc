@let machine = $machine();

@if ($show()) {
  <aside
    class="flex h-full w-full flex-col gap-4 bg-stone-900 p-4 text-slate-50"
    aria-label="Production editor sidebar"
  >
    <div class="flex items-center justify-between gap-2">
      <div class="text-[11px] font-semibold tracking-[0.32em] text-stone-400 uppercase">
        Production Editor
      </div>

      <button
        class="btn btn-icon btn-danger-outline"
        [title]="'Close editor'"
        (click)="onClose()"
        type="button"
      >
        <span class="sr-only">Close editor</span>
        <i class="fas fa-xmark"></i>
      </button>
    </div>

    <app-production-editor [$machine]="machine"></app-production-editor>
  </aside>
}
