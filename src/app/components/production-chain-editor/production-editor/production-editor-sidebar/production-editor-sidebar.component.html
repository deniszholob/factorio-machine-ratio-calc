@let machine = $machine();

@if ($show()) {
  <aside
    class="flex h-full w-full flex-col gap-4 border-l border-stone-700 bg-stone-950/60 p-4 text-slate-50"
    aria-label="Production editor sidebar"
  >
    <div class="flex items-center justify-between gap-2">
      <div class="text-[11px] font-semibold tracking-[0.32em] text-stone-400 uppercase">
        Production Editor
      </div>
      <button class="btn btn-icon btn-secondary-outline" type="button" (click)="onClose()">
        <span class="sr-only">Close editor</span>
        <i class="fas fa-xmark"></i>
      </button>
    </div>

    <app-production-editor [$machine]="machine"></app-production-editor>
  </aside>
}
