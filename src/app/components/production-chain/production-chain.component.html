@let production = $production();
@let activeId = $activeProductionId();
@let editingId = $editingProductionId();
@let editingName = $editingName();

<button
  class="flex cursor-pointer items-center justify-between gap-2 rounded-sm border border-stone-700 bg-stone-950/40 px-3 py-3 text-stone-100 transition hover:border-stone-600 hover:bg-stone-900/70"
  [ngClass]="{
    'border-b-orange-400 bg-stone-900 text-orange-200 hover:border-b-orange-300':
      production.id === activeId,
  }"
  (click)="$select.emit(production.id)"
  type="button"
>
  @if (production.id === editingId) {
    <div class="flex min-w-0 flex-1 flex-col gap-2">
      <label class="sr-only" [attr.for]="'production-name-' + production.id"> Chain name </label>
      <input
        class="m-0 w-full px-2 py-1 text-sm"
        #editInput
        [attr.id]="'production-name-' + production.id"
        [value]="editingName"
        (input)="$editName.emit(editInput.value)"
        (keydown.enter)="$commitRename.emit()"
        (keydown.escape)="$cancelRename.emit()"
        (blur)="$commitRename.emit()"
        type="text"
      />
    </div>
  } @else {
    <span class="truncate px-2 py-1 text-sm font-semibold">
      {{ production.name }}
    </span>
  }

  <div class="flex items-center gap-1">
    <!-- class="cursor-pointer rounded-sm border border-stone-700 px-2 py-1 text-xs text-stone-300 transition hover:border-stone-500 hover:text-stone-100 focus-visible:ring-2 focus-visible:ring-orange-400 focus-visible:outline-hidden" -->
    <button
      class="btn btn-warning-outline-fill px-2 py-1 text-xs"
      (click)="
        production.id === editingId ? $commitRename.emit() : $startRename.emit(production.id)
      "
      type="button"
    >
      <span class="sr-only">Rename chain</span>
      <i class="fas fa-pen"></i>
    </button>
    <!-- class="cursor-pointer rounded-sm border border-stone-700 px-2 py-1 text-xs text-stone-300 transition hover:border-red-400 hover:text-red-200 focus-visible:ring-2 focus-visible:ring-red-400 focus-visible:outline-hidden" -->
    <button
      class="btn btn-danger-outline-fill px-2 py-1 text-xs"
      (click)="$delete.emit(production.id)"
      type="button"
    >
      <span class="sr-only">Delete chain</span>
      <i class="fas fa-trash"></i>
    </button>
  </div>
</button>
