<div class="flex min-h-dvh w-full overflow-auto bg-stone-800 text-stone-100">
  <!-- Left Sidebar -->
  <aside
    class="flex w-96 shrink-0 flex-col gap-4 overflow-auto border-r border-stone-700 bg-stone-900"
    aria-label="Navigation"
  >
    <ng-content select="side-header"></ng-content>
    <ng-content select="side-content"></ng-content>
    <ng-content select="side-footer"></ng-content>
  </aside>

  <!-- Right Content -->
  <main class="flex min-w-0 flex-1 flex-col overflow-auto">
    <!-- Content Main-->
    <ng-content select="main-content"></ng-content>

    <!-- Content Footer -->
    <ng-content select="main-footer"></ng-content>
  </main>
</div>
