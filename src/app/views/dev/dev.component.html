  @if ($isSettingsOpen()) {
    <app-settings-view ngProjectAs="main-content"></app-settings-view>
  } @else if ($hasProductionChains()) {
    <app-production-chain-editor ngProjectAs="main-content"></app-production-chain-editor>
  } @else {
    <app-content-layout
      [$title]="'Production Chains'"
      [$showClose]="false"
      ngProjectAs="main-content"
    >
      <div class="flex min-h-0 flex-1 items-center justify-center px-6 py-10 text-center text-sm text-stone-300">
        Add a production chain in the sidebar to begin building ratios.
      </div>
    </app-content-layout>
  }

  <app-footer ngProjectAs="main-footer"></app-footer>
